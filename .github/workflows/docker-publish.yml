name: Docker Build & Push

on:
  push:
    branches:
      - production
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        required: true
        default: develop
        type: choice
        options:
          - develop
          - production

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: docker build -t "$IMAGE_NAME:${{ steps.tag.outputs.name }}" .

      - name: Push
        run: docker push "$IMAGE_NAME:${{ steps.tag.outputs.name }}"
